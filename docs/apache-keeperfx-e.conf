# Include from Apache's server configuration (e.g. /etc/apache2/conf.d/).
# This is a Directory overlay, NOT another VirtualHost or TLS configuration.
<Directory "/srv/www/vhosts/keeperfx-e.retrocs.org">
    Options -Indexes -MultiViews
    AllowOverride None
    DirectoryIndex index.php
    FallbackResource /index.php
    CGIPassAuth On
    Require all granted
    <FilesMatch "^(?:config\.inc\.php.*|\.|README\.md$)">
        Require all denied
    </FilesMatch>
</Directory>
<Directory "/srv/www/vhosts/keeperfx-e.retrocs.org/lib">
    Require all denied
    FallbackResource disabled
</Directory>
